        in: query
        schema:
          type: string
          format: date
          default: '2023-01-15'
      - name: end
        in: query
        schema:
          type: string
          format: date
          default: '2023-01-16'
      - name: type
        in: query
        schema:
          type: string
          default: ''
      - name: transaction_type
        in: query
        schema:
          type: string
          default: TRANSFER
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: perPage
        in: query
        schema:
          type: integer
          format: int32
          default: '50'
      - name: aggr
        in: query
        schema:
          type: boolean
          default: 'true'
        required: false
      responses:
