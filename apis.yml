name: Cora

description: Cora is a Brazilian digital bank (conta PJ) for small and medium businesses, offering fee-free business checking, Pix, boletos, transfers,
  payment initiation and financial management. Its developer platform exposes REST APIs for registered boleto and carnê issuance, Pix QR code
  generation, account data, balance and statement queries, payment and transfer initiation (including DARF and GPS tax payments), webhook notifications,
  and municipal service invoice (NFS-e) issuance. Cora offers two integration modalities — Direct Integration (mutual-TLS certificate plus OAuth2
  client-credentials) and Cora Partnership — with a Stage sandbox for testing. Backed by QED Investors and Ribbit Capital.

